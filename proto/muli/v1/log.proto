syntax = "proto3";

package muli.v1;

import "muli/v1/common.proto";

service LogService {
  rpc StreamLogs(StreamLogsRequest) returns (stream LogEntry);
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
}

message StreamLogsRequest {
  string job_id = 1;
  bool follow = 2;
  optional uint64 since_sequence = 3;
}

message LogEntry {
  string job_id = 1;
  uint64 sequence = 2;
  Timestamp timestamp = 3;
  string line = 4;
  LogStream stream = 5;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
  LOG_STREAM_SYSTEM = 3;
}

message GetLogsRequest {
  string job_id = 1;
  uint32 tail = 2;
}

message GetLogsResponse {
  repeated LogEntry entries = 1;
  bool is_complete = 2;
}
