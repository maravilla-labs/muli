[workspace]
resolver = "2"
members = [
    "crates/muli-proto",
    "crates/muli-core",
    "crates/muli-store",
    "crates/muli-engine",
    "crates/muli-queue",
    "crates/muli-server",
    "crates/muli-registry",
    "crates/muli-git",
    "crates/muli-pipeline",
    "crates/muli-agent",
    "crates/muli-test",
]

[workspace.package]
version = "0.4.16"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maravilla-labs/muli"

[workspace.dependencies]
# Internal crates
muli-core = { path = "crates/muli-core" }
muli-proto = { path = "crates/muli-proto" }
muli-store = { path = "crates/muli-store" }
muli-engine = { path = "crates/muli-engine" }
muli-queue = { path = "crates/muli-queue" }
muli-server = { path = "crates/muli-server" }
muli-registry = { path = "crates/muli-registry" }
muli-git = { path = "crates/muli-git" }
muli-pipeline = { path = "crates/muli-pipeline" }
muli-agent = { path = "crates/muli-agent" }
muli-test = { path = "crates/muli-test" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# gRPC
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
rustls = { version = "0.23", features = ["ring"] }

# Database
mongodb = "3.1"

# Docker
bollard = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dashmap = "6.1"
async-trait = "0.1"
futures = "0.3"

# HTTP (metrics + registry)
axum = "0.8.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Metrics
prometheus = "0.13"

# Retry
backoff = { version = "0.4", features = ["tokio"] }

# Config
dotenvy = "0.15"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Crypto (registry)
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
semver = { version = "1.0", features = ["serde"] }
tempfile = "3"
http-body-util = "0.1"

# Git
git2 = "0.19"
hmac = "0.12"

# SSH
russh = "0.46"
russh-keys = "0.46"

# URL parsing
url = "2.5"

# S3 (for LFS) — requires rustc 1.91+; enable via `lfs-s3` feature on muli-git
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }

# XML
quick-xml = "0.37"

serde_yaml = "0.9"
zstd = "0.13"
glob = "0.3"

# Hashing
md-5 = "0.10"

tar = "0.4"

# Constant-time comparison
subtle = "2.6"

# Password hashing
argon2 = { version = "0.5", features = ["std"] }
